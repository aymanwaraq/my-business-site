<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | BTS — Business Technology Solutions</title>
  <meta name="description" content="Insights on AI, automation, logistics, and digital transformation across the GCC." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Blog | BTS" />
  <meta property="og:description" content="Insights on AI, automation, logistics, and digital transformation across the GCC." />
  <meta property="og:url" content="https://btsapp.net/blog/" />

  <!-- Canonical + hreflang twin -->
  <link rel="canonical" href="https://btsapp.net/blog/" />
  <link rel="alternate" hreflang="en" href="https://btsapp.net/blog/" />
  <link rel="alternate" hreflang="ar" href="https://btsapp.net/blog/ar/" />

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/blog.css" />
</head>
<body class="blog-page">

  <div class="blog-container">
    <header class="blog-header">
      <div class="blog-header__inner">
        <div>
          <h1 class="blog-header__title">Blog</h1>
          <p class="blog-header__subtitle">
            Insights on AI, automation, logistics, and digital transformation.
          </p>
        </div>
        <a class="blog-lang-switch" href="/blog/ar/" hreflang="ar" lang="ar">
          <span>العربية</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </header>

    <main class="blog-index">
      <div id="blog-index-root" aria-live="polite" aria-busy="true"></div>
    </main>
  </div>

  <script src="/assets/js/blog.js"></script>
  <script>
    Blog.init({
      mode: "index",
      lang: "en",
      postsUrl: "/blog/posts.json"
    });
  </script>
</body>
</html>
