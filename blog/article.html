<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Blog – Article</title>
    <link rel="canonical" href="https://btsapp.net/blog/" />
    <meta name="description" content="Insights on AI automation, business intelligence, bilingual software, and digital transformation from BTS.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.6);
            --bg-card-hover: rgba(30, 30, 45, 0.8);
            --primary: #4a90e2;
            --secondary: #7b2cbf;
            --accent: #e879f9;
            --border: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.12);
            --text-gray: #a0a0b0;
            --text-light: #c0c0d0;
            --radius: 20px;
            --radius-sm: 12px;
            --whatsapp: #25D366;
        }

        body {
            background: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.rtl {
            direction: rtl;
            text-align: right;
            font-family: 'Cairo', 'Inter', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .logo:hover { background: rgba(74, 144, 226, 0.1); }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
        }

        .logo-title {
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: white; }

        .lang-btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(74, 144, 226, 0.3);
            background: rgba(74, 144, 226, 0.08);
            color: var(--primary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            border-color: var(--primary);
            background: rgba(74, 144, 226, 0.2);
        }

        /* Article Hero — REDUCED title size */
        .article-hero {
            padding: 110px 0 20px;
        }

        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .back-link:hover { text-decoration: underline; }

        .article-hero .category {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            background: rgba(74, 144, 226, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-hero h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 16px;
            max-width: 900px;
            background: linear-gradient(135deg, #fff, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .article-meta {
            display: flex;
            gap: 20px;
            color: var(--text-gray);
            font-size: 13px;
            flex-wrap: wrap;
        }

        /* Cover image — REDUCED height */
        .article-cover {
           display: block;
           width: 100%;
           max-width: 720px;
           height: 260px;
           object-fit: cover;
           object-position: center;
           border-radius: var(--radius);
           margin: 10px auto 32px;
           border: 1px solid var(--border);
         }

        /* Article Body — REDUCED font size */
        .article-body {
            max-width: 760px;
            margin: 0 auto 50px;
            font-size: 16px;
            line-height: 1.75;
            color: var(--text-light);
        }

        .article-body h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin: 36px 0 14px;
            padding-top: 6px;
        }

        .article-body p {
            margin-bottom: 18px;
        }

        .article-body ul {
            margin: 14px 0 20px 24px;
        }

        body.rtl .article-body ul {
            margin: 14px 24px 20px 0;
        }

        .article-body li {
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .article-body blockquote {
            border-left: 4px solid var(--primary);
            padding: 12px 22px;
            margin: 28px 0;
            font-size: 17px;
            font-style: italic;
            color: #fff;
            background: rgba(74, 144, 226, 0.06);
            border-radius: 0 12px 12px 0;
        }

        body.rtl .article-body blockquote {
            border-left: none;
            border-right: 4px solid var(--primary);
            border-radius: 12px 0 0 12px;
        }

        .article-image {
            margin: 30px 0;
            text-align: center;
        }

        .article-image img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: opacity 0.2s, transform 0.2s;
        }

        .article-image img:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .article-image figcaption {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 10px;
            font-style: italic;
        }

        /* Lightbox */
        #lightbox {
            display: none;
        }
        #lightbox.active {
            display: flex !important;
            animation: fadeIn 0.2s ease;
        }
        #lightbox img {
            animation: zoomIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .article-cta {
            text-align: center;
            padding: 40px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 70px;
        }

        .article-cta h3 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .article-cta p {
            color: var(--text-gray);
            margin-bottom: 20px;
            font-size: 15px;
        }

        .cta-btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .cta-btn:hover { transform: translateY(-2px); }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border);
            padding: 40px 0 30px;
            background: rgba(0, 0, 0, 0.2);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 11px;
            color: var(--text-gray);
        }

        .footer-bottom a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 80px 0;
            color: var(--text-gray);
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .float-wa {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            background: var(--whatsapp);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            border: none;
        }

        .float-wa svg { width: 26px; height: 26px; fill: white; }

        body.rtl .float-wa { right: auto; left: 24px; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .article-hero h1 { font-size: 24px; }
            .article-hero { padding: 90px 0 20px; }
            .article-body { font-size: 15px; }
            .article-body h2 { font-size: 19px; }
            .article-cover { max-height: 240px; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="logo">
            <img class="logo-img" src="/assets/images/Logo.png" alt="BTS Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' rx=\'20\' fill=\'%234a90e2\'/%3E%3Ctext x=\'50%25\' y=\'55%25\' text-anchor=\'middle\' fill=\'white\' font-size=\'34\' font-weight=\'800\' dy=\'.3em\'%3EBTS%3C/text%3E%3C/svg%3E'">
            <span class="logo-title">BTS Blog</span>
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/blog/">Blog</a>
            <a href="/#contact">Contact</a>
            <button class="lang-btn" onclick="switchLang()" id="langBtn">عربي</button>
        </div>
    </div>
</nav>

<section class="article-hero">
    <div id="article-content">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top:16px;">Loading article...</p>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <span>© 2026 BTS — Business Technology Solutions. Registered company number: SC894313.</span>
            <span>
                <a href="/privacy-policy.html">Privacy Policy</a> |
                <a href="/terms-of-service.html">Terms of Service</a>
            </span>
        </div>
    </div>
</footer>

<button class="float-wa" onclick="window.open('https://wa.me/447425252625', '_blank')">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.48 2 2 6.48 2 12c0 1.92.54 3.68 1.47 5.19L2 22l4.81-1.47C8.32 21.46 10.08 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
</button>

<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;cursor:zoom-out;align-items:center;justify-content:center;padding:40px;">
    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" style="max-width:95%;max-height:95%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.5);cursor:default;">
</div>

<script>
    // ==================== STATE ====================
    let currentArticle = null;
    let currentLang = 'en';

    // ==================== LOAD ARTICLE ====================
    async function loadArticle() {
        const container = document.getElementById('article-content');
        container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:16px;">Loading article...</p></div>';

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const lang = urlParams.get('lang') || 'en';
        currentLang = lang;

        if (!slug) {
            container.innerHTML = '<div class="container" style="padding:120px 0 60px;text-align:center;"><h1>Article Not Found</h1><p style="color:var(--text-gray);margin-top:16px;">No article slug provided.</p><a href="/blog/" style="color:var(--primary);display:inline-block;margin-top:20px;">← Back to Blog</a></div>';
            return;
        }

        try {
            let response;
            try {
                response = await fetch('/blog/posts.json');
                if (!response.ok) throw new Error('not found at /blog/');
            } catch {
                response = await fetch('posts.json');
            }

            if (!response.ok) throw new Error('Failed to fetch posts');
            const posts = await response.json();

            const article = posts.find(p => p.slug === slug && p.lang === lang);

            if (!article) {
                container.innerHTML = '<div class="container" style="padding:120px 0 60px;text-align:center;"><h1 style="font-size:60px;">404</h1><p style="color:var(--text-gray);margin-top:16px;">Article not found.</p><a href="/blog/" style="color:var(--primary);display:inline-block;margin-top:20px;">← Back to Blog</a></div>';
                return;
            }

            currentArticle = article;
            renderArticle(article);

        } catch (error) {
            console.error('Error loading article:', error);
            container.innerHTML = '<div class="container" style="padding:120px 0 60px;text-align:center;"><h1>Error</h1><p style="color:var(--text-gray);margin-top:16px;">Could not load article. Please check the console for details.</p></div>';
        }
    }

    // ==================== RENDER ARTICLE ====================
    function renderArticle(article) {
        const container = document.getElementById('article-content');

        const isRTL = article.direction === 'rtl' || article.lang === 'ar';
        if (isRTL) {
            document.body.classList.add('rtl');
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', 'ar');
            document.getElementById('langBtn').innerText = 'EN';
        } else {
            document.body.classList.remove('rtl');
            document.documentElement.setAttribute('dir', 'ltr');
            document.documentElement.setAttribute('lang', 'en');
            document.getElementById('langBtn').innerText = 'عربي';
        }

        document.title = article.title + ' | BTS Blog';

        let html = `
            <div class="container">
                <a href="/blog/" class="back-link">← ${isRTL ? 'العودة إلى المدونة' : 'Back to Blog'}</a>
                <div class="category">${article.category || 'General'}</div>
                <h1>${article.title}</h1>
                <div class="article-meta">
                    <span>📅 ${formatDate(article.date, article.lang)}</span>
                    <span>✍️ ${article.author || 'BTS'}</span>
                </div>
            </div>
        `;

        // Cover image
        if (article.cover) {
            html += `
                <div class="container">
                    <img src="${article.cover}" alt="${article.title}" class="article-cover" onerror="this.style.display='none'">
                </div>
            `;
        }

        // Body content
        html += '<div class="container"><div class="article-body">';

        if (article.content && Array.isArray(article.content)) {
            let openList = false;

            article.content.forEach(block => {
                if (openList && block.type !== 'paragraph') {
                    html += '</ul>';
                    openList = false;
                }

                switch (block.type) {
                    case 'heading':
                        html += `<h2>${block.text}</h2>`;
                        break;

                    case 'paragraph':
                        if (block.text.trim().startsWith('-')) {
                            if (!openList) {
                                html += '<ul>';
                                openList = true;
                            }
                            html += `<li>${block.text.trim().substring(1).trim()}</li>`;
                        } else {
                            html += `<p>${block.text}</p>`;
                        }
                        break;

                    case 'image':
                        html += `
                            <figure class="article-image">
                                <img src="${block.src}" alt="${block.caption || ''}" onclick="openLightbox('${block.src}')" onerror="this.parentElement.style.display='none'">
                                ${block.caption ? `<figcaption>${block.caption}</figcaption>` : ''}
                            </figure>
                        `;
                        break;

                    case 'quote':
                        html += `<blockquote>${block.text}</blockquote>`;
                        break;

                    case 'list':
                        html += `<ul>${block.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
                        break;

                    default:
                        console.warn('Unknown block type:', block.type);
                }
            });

            if (openList) html += '</ul>';
        }

        html += '</div></div>';

        // CTA
        html += `
            <div class="container">
                <div class="article-cta">
                    <h3>${isRTL ? 'هل أنت مستعد للتحول الرقمي؟' : 'Ready to Transform Your Business?'}</h3>
                    <p>${isRTL ? 'تواصل مع BTS لمناقشة احتياجاتك في الذكاء الاصطناعي والأتمتة.' : 'Get in touch with BTS to discuss your AI, automation, or dashboard needs.'}</p>
                    <a href="/#contact" class="cta-btn">${isRTL ? 'اتصل بنا' : 'Contact BTS'}</a>
                </div>
            </div>
        `;

        container.innerHTML = html;
        window.scrollTo(0, 0);
    }

    // ==================== HELPERS ====================
    function formatDate(dateStr, lang) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB', options);
    }

    async function switchLang() {
        if (!currentArticle) return;
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const newLang = currentLang === 'en' ? 'ar' : 'en';
        window.location.href = `/blog/article.html?slug=${slug}&lang=${newLang}`;
    }

    // ==================== LIGHTBOX ====================
    function openLightbox(src) {
        const lightbox = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        img.src = src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    // ==================== INIT ====================
    document.addEventListener('DOMContentLoaded', loadArticle);
</script>

</body>
</html>
